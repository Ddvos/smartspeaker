services:
  postgres:
    image: postgres:15-alpine
    container_name: lampje-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: lampje
      POSTGRES_PASSWORD: lampje_dev_password
      POSTGRES_DB: lampje
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
